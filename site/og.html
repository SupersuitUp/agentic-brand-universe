<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<!-- Source of og.jpg (1200x630). Render: headless Chrome --screenshot --window-size=1200,630 og.html, then convert to jpg.
     Ascent tokens only (continental-works-universe canon/craft/the-ascent.json#tokens). -->
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT@9..144,400..900,0..100&display=swap');
  *{margin:0;box-sizing:border-box}
  :root{
    --mulberry:#A12A5E; --burnt:#DD562F; --mustard:#E9A23B; --sand:#EED79E; --tan:#D6B175;
    --cream:#F6E7C5; --aqua:#69B1B5; --teal:#105971; --ink:#1E1B19;
    --serif:"Fraunces",Georgia,serif; --mono:ui-monospace,"SF Mono",Menlo,monospace;
  }
  html,body{width:1200px;height:630px}
  body{background:var(--teal); padding:18px; font-family:var(--serif); color:var(--ink)}
  .card{position:relative; width:100%; height:100%; background:var(--cream); border-radius:22px; overflow:hidden; padding:62px 72px 0 72px}
  .chip{display:inline-flex; align-items:center; gap:14px; background:var(--teal); color:var(--cream); border-radius:999px; padding:10px 24px 10px 12px; font-size:24px; font-weight:600}
  .chip b{width:30px; height:30px; border-radius:50%; background:var(--mustard)}
  h1{font-size:118px; line-height:.98; font-weight:800; letter-spacing:-.02em; margin-top:34px; font-variation-settings:"SOFT" 50}
  h1 u{text-decoration:none; box-shadow:inset 0 -9px 0 var(--mulberry)}
  .sub{font-size:30px; line-height:1.35; margin-top:26px; max-width:860px; color:color-mix(in srgb,var(--ink) 72%,var(--cream))}
  .foot{position:absolute; left:72px; right:72px; bottom:46px; display:flex; justify-content:space-between; align-items:center; font-family:var(--mono); font-size:22px; color:var(--teal)}
  .foot .tags span{border:2px solid var(--tan); border-radius:999px; padding:6px 16px; margin-right:10px; color:var(--ink)}
  .foot .url{font-weight:600}
</style>
</head>
<body>
  <div class="card">
    <div class="chip"><b></b>An open standard from Continental Works</div>
    <h1>Your brand,<br /><u>as code.</u></h1>
    <p class="sub">A version-controlled universe your agent renders on demand, and a build check that refuses what is off brand.</p>
    <div class="foot"><div class="tags"><span>plugin</span><span>npm</span><span>spec v0.61</span></div><div class="url">agenticbranduniverse.com</div></div>
  </div>
</body>
</html>
